def DEFAULT_VERSION = '1.0.0'
def DEFAULT_GROUP = 'io.github.tronprotocol'

buildscript {
    repositories {
        mavenLocal()
        maven {
            url "https://plugins.gradle.org/m2/"
        }
        maven {
            url "https://cdn.lfrs.sl/repository.liferay.com/nexus/content/groups/public"
        }
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath 'io.github.gradle-nexus:publish-plugin:1.1.0'
    }
}

apply plugin: 'java'
apply plugin: 'java-library'
apply plugin: 'maven-publish'

ext {
    bouncycastleVersion = '1.84'
    junitJupiterVersion = '5.4.2'
    googleGuavaVersion = '33.0.0-jre'
    jacksonVersion = '2.18.9'
    // grpc-netty and netty are compatibility-coupled: each grpc-java release is
    // tested against a specific netty line, so bump these two together
    grpcVersion = '1.81.0'
    nettyVersion = '4.1.135.Final'
    vertxVersion = '4.5.27'
}

allprojects {
    version = project.hasProperty("VERSION") ? project.property("VERSION") : DEFAULT_VERSION
    group = project.hasProperty("GROUP") ? project.property("GROUP") : DEFAULT_GROUP


    repositories {
        mavenCentral()
    }

    tasks.withType(Jar) {
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    }

    tasks.withType(Javadoc).tap {
        configureEach {
            options.encoding = 'UTF-8'
            options.charSet = 'UTF-8'
            options.addStringOption('Xdoclint:none', '-quiet')

            options {
                tags = [
                        'apiNote:a:API Note:',
                        'implSpec:a:Implementation Requirements:',
                        'implNote:a:Implementation Note:'
                ]
            }

            exclude '**/internal/**'
            exclude '**/impl/**'
            failOnError = false

            logging.captureStandardError LogLevel.INFO
            logging.captureStandardOutput LogLevel.INFO
        }
    }

    configurations.configureEach {
        resolutionStrategy {
            // pin the advertised guava; otherwise resolution floats with grpc's requests
            force("com.google.guava:guava:$googleGuavaVersion")
            // checkstyle's build-time transitive; its 1.9.4 has CVE-2025-48734
            force("commons-beanutils:commons-beanutils:1.11.0")
            // align netty transitives (grpc-netty/vertx). NOT a platform("io.netty:netty-bom"):
            // the publish workflow copies implementation.allDependencies into the released POM,
            // where a BOM surfaces as an unresolvable dependency. tcnative versions independently
            eachDependency { details ->
                if (details.requested.group == 'io.netty'
                        && !details.requested.name.startsWith('netty-tcnative')) {
                    details.useVersion(nettyVersion)
                }
            }
        }
    }

}

subprojects {
    apply plugin: 'java'
    apply plugin: 'checkstyle'

    tasks.withType(Jar).configureEach {
        destinationDirectory = rootProject.file("build/libs")
    }

    java {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.current()
    }

    dependencies {
        testImplementation "org.junit.jupiter:junit-jupiter:$junitJupiterVersion"

        compileOnly 'org.projectlombok:lombok:1.18.34'
        annotationProcessor 'org.projectlombok:lombok:1.18.34'
        testCompileOnly 'org.projectlombok:lombok:1.18.34'
        testAnnotationProcessor 'org.projectlombok:lombok:1.18.34'
    }

    test {
        useJUnitPlatform()
        testLogging {
            events 'passed', 'skipped', 'failed'
        }
    }

    tasks.register('sourcesJar', Jar) {
        dependsOn classes
        archiveClassifier = 'sources'
        from sourceSets.main.allSource
    }

    tasks.register('javadocJar', Jar) {
        dependsOn javadoc
        archiveClassifier = 'javadoc'
        from javadoc.destinationDir
    }

    tasks.withType(JavaCompile).configureEach {
        //options.compilerArgs << "-Xlint:unchecked" << "-Xlint:deprecation"
    }

    artifacts {
        archives jar
        archives sourcesJar
        archives javadocJar
    }

    configurations {
        checkstyleConfig
    }
    configurations.named('checkstyleConfig') {
        transitive = false
    }
    checkstyle {
        toolVersion = "8.29"
        configFile = file("../config/checkstyle/checkStyleAll.xml")
        maxWarnings = 0
    }
    checkstyleMain {
        source = 'src/main/java'
        exclude '**/trident/api/**'
        exclude '**/trident/proto/**'
    }
    checkstyleTest {
        source = files() //use empty files to ignore test class
    }
}

javadoc {
    source subprojects.collect { project ->
        project.sourceSets.main.allJava
    }
    classpath = files(subprojects.collect { project ->
        project.sourceSets.main.compileClasspath
    })
}

tasks.register('javadocJar', Jar) {
    archiveClassifier = 'javadoc'
    from javadoc
}

tasks.register('sourcesJar', Jar) {
    archiveClassifier = 'sources'
    from subprojects.collect { project ->
        project.sourceSets.main.allSource
    }
}

tasks.register('buildLib', Jar) {
    from subprojects.collect { project ->
        project.sourceSets.main.output
    }
}

tasks.named('build') {
    dependsOn javadocJar, sourcesJar, buildLib
}

artifacts {
    archives jar
    archives javadocJar
    archives sourcesJar
}